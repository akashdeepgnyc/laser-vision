[project]
name = "laser-vision"
version = "0.1.0"
description = "Layer-selective rank reduction (LASER) on pretrained vision models"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch==2.6.0",          # matches the course-validated env (cu124 wheels on Linux)
    "torchvision==0.21.0",
    "timm>=1.0.15",
    "open_clip_torch>=2.32",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
